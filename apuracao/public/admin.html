<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Moderação Manual</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151d30;
            --border-color: #2a3655;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --brand-orange: #f75c2e;
            --green: #10b981;
            --red: #ef4444;
            --yellow: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg-color); color: var(--text-main); padding: 2rem 1rem; }
        .container { max-width: 1000px; margin: 0 auto; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; }
        h1 { font-size: 1.4rem; }
        
        .auth-bar input { background: var(--card-bg); border: 1px solid var(--border-color); color: #fff; padding: 0.5rem 0.8rem; border-radius: 6px; }
        .btn { padding: 0.5rem 1rem; border-radius: 6px; font-weight: 600; cursor: pointer; border: 1px solid transparent; font-size: 0.85rem; transition: 0.2s; }
        .btn-action { background: var(--brand-orange); color: #fff; }
        .btn-refresh { background: var(--card-bg); color: var(--text-main); border-color: var(--border-color); }

        .filtro-tabs { display: flex; gap: 10px; margin-bottom: 1.5rem; }
        .filtro-tabs button { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-muted); padding: 0.5rem 1.2rem; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .filtro-tabs button.ativo { background: var(--brand-orange); color: #fff; border-color: var(--brand-orange); }

        .bet-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 1.2rem; margin-bottom: 1rem; }
        .bet-header { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.5rem; }
        .bet-game { font-size: 1.05rem; font-weight: 700; margin-bottom: 0.4rem; color: #fff; }
        .bet-info { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem; line-height: 1.5; }
        
        .bet-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border-top: 1px solid var(--border-color); padding-top: 0.8rem; }
        .btn-win { background: rgba(16, 185, 129, 0.15); color: var(--green); border-color: var(--green); }
        .btn-win:hover { background: var(--green); color: #fff; }
        .btn-loss { background: rgba(239, 68, 68, 0.15); color: var(--red); border-color: var(--red); }
        .btn-loss:hover { background: var(--red); color: #fff; }
        .btn-pendente { background: rgba(245, 158, 11, 0.15); color: var(--yellow); border-color: var(--yellow); }
        .btn-pendente:hover { background: var(--yellow); color: #000; }

        .tag-revisao { background: rgba(247, 92, 46, 0.2); color: var(--brand-orange); border: 1px solid var(--brand-orange); padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: 700; margin-left: 6px; }
        .empty-msg { text-align: center; color: var(--text-muted); padding: 3rem; background: var(--card-bg); border-radius: 8px; border: 1px dashed var(--border-color); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>Central de Moderação de Apostas</h1>
            <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 4px;">Resolução manual com credencial Admin do Backend</p>
        </div>
        <div class="auth-bar">
            <input type="password" id="adminKeyInput" placeholder="Chave do Painel..." />
            <button class="btn btn-action" onclick="salvarChave()">Conectar</button>
        </div>
    </header>

    <div id="painel" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <div class="filtro-tabs">
                <button class="ativo" id="tabPendentes" onclick="setFiltro('pendentes')">Pendentes / Em Revisão</button>
                <button id="tabTodas" onclick="setFiltro('todas')">Todas as Apostas</button>
            </div>
            <button class="btn btn-refresh" onclick="carregarApostas()">🔄 Recarregar</button>
        </div>

        <div id="feedApostas">
            <div class="empty-msg">Carregando apostas...</div>
        </div>
    </div>
</div>

<script>
    let chaveAdmin = localStorage.getItem('admin_key') || '';
    let todasApostas = [];
    let filtroAtual = 'pendentes';

    if (chaveAdmin) {
        document.getElementById('adminKeyInput').value = chaveAdmin;
        conectarPainel();
    }

    function salvarChave() {
        chaveAdmin = document.getElementById('adminKeyInput').value.trim();
        localStorage.setItem('admin_key', chaveAdmin);
        conectarPainel();
    }

    function conectarPainel() {
        if (!chaveAdmin) return alert("Digite a chave de administrador.");
        document.getElementById('painel').style.display = 'block';
        carregarApostas();
    }

    function setFiltro(tipo) {
        filtroAtual = tipo;
        document.getElementById('tabPendentes').className = tipo === 'pendentes' ? 'ativo' : '';
        document.getElementById('tabTodas').className = tipo === 'todas' ? 'ativo' : '';
        renderizar();
    }

    async function carregarApostas() {
        const container = document.getElementById('feedApostas');
        container.innerHTML = `<div class="empty-msg">Consultando Firestore via Backend...</div>`;

        try {
            const res = await fetch('/api/apostas', {
                headers: { 'x-admin-key': chaveAdmin }
            });

            if (!res.ok) {
                const erro = await res.json();
                container.innerHTML = `<div class="empty-msg" style="color: var(--red);">${erro.erro || 'Falha de autorização'}</div>`;
                return;
            }

            todasApostas = await res.json();
            renderizar();
        } catch (e) {
            container.innerHTML = `<div class="empty-msg" style="color: var(--red);">Erro ao comunicar com o servidor: ${e.message}</div>`;
        }
    }

    function renderizar() {
        const container = document.getElementById('feedApostas');
        let lista = todasApostas;

        if (filtroAtual === 'pendentes') {
            lista = lista.filter(a => (a.status || 'pendente').toLowerCase() === 'pendente');
        }

        if (lista.length === 0) {
            container.innerHTML = `<div class="empty-msg">Nenhuma aposta encontrada neste filtro.</div>`;
            return;
        }

        let html = '';
        lista.forEach(ap => {
            const statusLower = (ap.status || 'pendente').toLowerCase();
            let corStatus = '#f59e0b';
            if (statusLower === 'ganha') corStatus = '#10b981';
            if (statusLower === 'perdida') corStatus = '#ef4444';

            const tagRevisao = ap.jaPediuVerificacao ? `<span class="tag-revisao">PEDIU REVISÃO</span>` : '';

            html += `
                <div class="bet-card" id="card_${ap.idUnico}">
                    <div class="bet-header">
                        <span>👤 <strong>${ap.userName}</strong> | 📅 ${ap.data || 'N/D'}</span>
                        <span style="color: ${corStatus}; font-weight: bold; text-transform: uppercase;">
                            ${ap.status || 'Pendente'} ${tagRevisao}
                        </span>
                    </div>

                    <div class="bet-game">${ap.partida || 'Partida'}</div>

                    <div class="bet-info">
                        Palpite: <strong style="color: var(--brand-orange);">${ap.selecao}</strong> | 
                        Odd: <strong>${ap.odd}</strong> | 
                        Entrada: <strong>R$ ${parseFloat(ap.valor || 0).toFixed(2)}</strong> | 
                        Retorno: <strong style="color: var(--green);">R$ ${parseFloat(ap.retorno || 0).toFixed(2)}</strong>
                    </div>

                    <div class="bet-actions">
                        <span style="font-size: 0.8rem; color: var(--text-muted); margin-right: auto;">Marcar como:</span>
                        <button class="btn btn-win" onclick="alterarStatus('${ap.userId}', '${ap.idUnico}', 'Ganha')">Ganha ✅</button>
                        <button class="btn btn-loss" onclick="alterarStatus('${ap.userId}', '${ap.idUnico}', 'Perdida')">Perdida ❌</button>
                        <button class="btn btn-pendente" onclick="alterarStatus('${ap.userId}', '${ap.idUnico}', 'Pendente')">Pendente ⏳</button>
                    </div>
                </div>
            `;
        });

        container.innerHTML = html;
    }

    async function alterarStatus(userId, idUnico, novoStatus) {
        const card = document.getElementById(`card_${idUnico}`);
        if (card) card.style.opacity = '0.4';

        try {
            const res = await fetch('/api/atualizar-status', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-admin-key': chaveAdmin
                },
                body: JSON.stringify({ userId, idUnico, novoStatus })
            });

            const data = await res.json();
            if (!res.ok) throw new Error(data.erro || 'Falha ao atualizar');

            await carregarApostas();
        } catch (e) {
            alert("Erro: " + e.message);
            if (card) card.style.opacity = '1';
        }
    }
</script>

</body>
</html>
